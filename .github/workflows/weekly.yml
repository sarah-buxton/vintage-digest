name: Weekly vintage check

on:
  schedule:
    - cron: "17 5 * * 1"   # Mondays 05:17 UTC (06:17 Amsterdam in winter, 07:17 in summer)
  workflow_dispatch:        # adds a "Run workflow" button for running it by hand

permissions:
  contents: write

concurrency:
  group: weekly-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python scraper/run.py
      - name: Save results
        run: |
          git config user.name "weekly-check"
          git config user.email "actions@users.noreply.github.com"
          git add data/state.json docs/data.json
          git diff --cached --quiet || git commit -m "Weekly check $(date -u +%F)"
          git pull --rebase
          git push
